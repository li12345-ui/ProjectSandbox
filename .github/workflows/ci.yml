name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read  # 仅需读代码+上传产物，无写权限

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Godot 4 + .NET 10 跨平台，先用最省资源的 Linux runner
    timeout-minutes: 15     # 超时保护，避免卡死

    steps:
      # 1. Checkout 代码（拉取 main 分支全量，含子模块如有）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # 保留完整历史，方便后续 git 操作

      # 2. Setup Godot 4.7.2 .NET 版（官方 Release 直下，自诊断鲁棒版：
      #    下载 → 打印体积（防"假 200 小响应"）→ 解压到 /opt/godot
      #    → find 定位二进制（官方 zip 内二进制名与包名不同，禁止硬编码 mv）
      #    → 软链到 PATH → 验证版本；GodotSharp/ 随解压保留供 C# 构建使用）
      - name: Setup Godot 4.7.2 (.NET)
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          ls -l godot.zip
          SIZE=$(stat -c%s godot.zip)
          if [ "$SIZE" -lt 50000000 ]; then
            echo "!! 下载异常：godot.zip 仅 ${SIZE} 字节（正常约 103MB）"
            echo "!! 响应前 800 字节："
            head -c 800 godot.zip
            exit 1
          fi
          sudo mkdir -p /opt/godot
          unzip -q godot.zip -d /opt/godot
          ls -la /opt/godot
          GODOT_BIN=$(find /opt/godot -maxdepth 3 -type f -name 'Godot_*' -executable -print -quit)
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          godot --version  # 打印版本验证安装成功
          find /opt/godot -maxdepth 3 -type d -name 'GodotSharp'  # 确认 C# 支持就绪

      # 3. Setup .NET SDK 10（2025 LTS，Godot 4.5+ 要求 .NET 8+，"or later" 含 9/10；
      #    不写 dotnet-quality，走 action 默认 GA 正式版通道——"stable" 不是其支持的取值，
      #    上轮已被 runner 校验报错拒绝）
      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # 4. 校验 .sln/.csproj 是否存在（Godot headless 不保证能生成 .NET 解决方案，
      #     用户首次使用须在本地 Godot .NET 编辑器里打开一次项目，让编辑器自动生成后提交）
      - name: Verify .sln/.csproj exists
        run: |
          if [ ! -f ProjectSandbox.sln ]; then
            echo "ERROR: 未找到 ProjectSandbox.sln"
            echo "请在本地 Godot 4.7 .NET 编辑器中打开项目一次，让编辑器自动生成 .sln/.csproj 后提交到仓库。"
            exit 1
          fi

      # 5. 构建 C# 项目（Debug 配置，便于调试）
      - name: Build .NET project
        run: dotnet build ProjectSandbox.sln --configuration Debug --no-incremental
        env:
          DOTNET_CLI_HOME: /tmp/dotnet  # 避免 runner 根目录写权限问题
          DOTNET_NOLOGO: "true"          # 减少日志噪音

      # 6. 运行 tests/ 下全部自测脚本（断言失败以退出码 1 结束，使本步失败）
      - name: Run tests
        run: |
          godot --headless --path . --script res://tests/CoreSelfTest.cs --quit
          godot --headless --path . --script res://tests/WorldSelfTest.cs --quit
          godot --headless --path . --script res://tests/VerticalSliceSelfTest.cs --quit
        env:
          GODOT_DISABLE_CRASH_HANDLER: "1"

      # 7. 冒烟测试：实际加载主场景（非仅打开项目管理器）
      - name: Smoke test (load Main.tscn)
        run: |
          godot --headless --path . --scene res://Main.tscn --quit
        env:
          GODOT_DISABLE_CRASH_HANDLER: "1"  # 让崩溃直接以非零退出码暴露

      # 8. 上传构建产物（供调试、后续 Release 工作流使用）
      # 注：Godot.NET.Sdk 将产物放在 .godot/mono/temp/bin/Debug/，
      #     而非标准的 bin/Debug/net8.0/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .godot/mono/temp/bin/Debug/
          if-no-files-found: warn  # 避免无产物时 CI 失败
          retention-days: 7        # 短期调试用，7 天后自动清理
